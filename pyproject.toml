[project]
name = "EDSSAnnotation"
version = "0.1.0"
description = "Packages required for the EDSS annotation and visualization functionality."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lifelines>=0.30.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
    "streamlit>=1.58.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
